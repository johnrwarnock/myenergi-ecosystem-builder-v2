name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use a modern npm
        # A large npm major-version gap between the runner's bundled npm and
        # whatever generated package-lock.json can make `npm ci` reject a
        # lockfile that's actually in sync — pin explicitly rather than
        # trusting whatever ships with the Node version above.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run calculation tests (Vitest)
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual/overlap regression tests (Playwright)
        run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
