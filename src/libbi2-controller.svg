<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 330" width="260" height="330">
  <!-- libbi 2 controller — line art in the style of the eddi icon, narrower body, 4 buttons -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- antennas -->
    <line x1="88" y1="6" x2="88" y2="34" stroke-width="5"/>
    <line x1="172" y1="6" x2="172" y2="34" stroke-width="5"/>
    <rect x="83" y="32" width="10" height="7" fill="#000" stroke="none"/>
    <rect x="167" y="32" width="10" height="7" fill="#000" stroke="none"/>
    <!-- body + side strips -->
    <rect x="6" y="40" width="248" height="284" rx="10" stroke-width="6"/>
    <line x1="62" y1="43" x2="62" y2="321" stroke-width="1.6"/>
    <line x1="198" y1="43" x2="198" y2="321" stroke-width="1.6"/>
    <!-- screen -->
    <rect x="84" y="100" width="92" height="58" rx="7" stroke-width="1.8"/>
    <!-- button legends -->
    <g stroke-width="1.6">
      <line x1="88" y1="178" x2="98" y2="178"/><line x1="88" y1="182" x2="98" y2="182"/><line x1="88" y1="186" x2="98" y2="186"/>
      <polyline points="112,186 117,178 122,186"/>
      <polyline points="137,178 142,186 147,178"/>
      <line x1="167" y1="182" x2="177" y2="182"/><line x1="172" y1="177" x2="172" y2="187"/>
    </g>
    <!-- four buttons -->
    <g stroke-width="1.8">
      <circle cx="93" cy="203" r="9"/><circle cx="117" cy="203" r="9"/><circle cx="142" cy="203" r="9"/><circle cx="167" cy="203" r="9"/>
    </g>
    <!-- myenergi mark: two overlapping slanted pills -->
    <g stroke-width="1.8" transform="translate(130,268) rotate(38)">
      <rect x="-13" y="-22" width="12" height="32" rx="6"/>
      <rect x="1" y="-10" width="12" height="32" rx="6"/>
    </g>
  </g>
  <!-- wordmark, vertical in the left strip like the eddi icon -->
  <text x="0" y="0" transform="translate(44,300) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="300" fill="#000" letter-spacing="1">libbi</text>
</svg>
